name: Test Dispatch
on:
    workflow_dispatch:
jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: Check if menus already scraped
              id: check_menus
              run: |
                RESPONSE=$(curl -sf "${{ secrets.SYNC_API_URL }}/mensa/scraped-status" \
                    -H "X-Internal-Key: ${{ secrets.SYNC_API_KEY }}")
                SCRAPED=$(echo "$RESPONSE" | jq -r '.data.scraped')
                echo "scraped=$SCRAPED" >> "$GITHUB_OUTPUT"

            - name: Test
              if: steps.check_menus.outputs.scraped != 'true'
              run: echo "scraped is false"