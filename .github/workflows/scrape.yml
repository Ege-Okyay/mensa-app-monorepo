name: Mensa Menu Scraper Cron

on:
  schedule:
      - cron: '20,40 10 * * 1-5'
      - cron: '0,20,40 11 * * 1-5'
      - cron: '0,20 12 * * 1-5'
      - cron: '0 15 * * 1-5'
  workflow_dispatch:

jobs:
  scrape-and-sync:
      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: menu-scraper

      steps:
          - name: Checkout repository
            uses: actions/checkout@v6
          
          - name: Set up Go
            uses: actions/setup-go@v6
            with:
              go-version: 'stable'
              cache-dependency-path: menu-scraper/go.sum
          
          - name: Install dependencies
            run: |
              go mod download
          
          - name: Build scraper
            run: |
              go build -o scraper ./cmd/main.go

          - name: Run scraper
            env:
              # Internal
              PORT: 3001
              SYNC_API_KEY: ${{ secrets.SYNC_API_KEY  }}
              SYNC_API_URL: ${{ secrets.SYNC_API_URL }}
              RATE_LIMIT: 5

              # Gemini
              GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
              GEMINI_MODEL: gemini-3.1-flash-lite
              GEMINI_PROMPT_FILE_NAME: analysis_v5.txt

              # Other
              IG_STORY_API_URL: ${{ secrets.IG_STORY_API_URL }}
              GO_ENV: production
            run: |
              ./scraper 2>&1 | tee scraper.log
          
          - name: Upload logs on failure
            if: failure()
            uses: actions/upload-artifact@v4
            with:
              name: scraper-error-logs
              path: |
                menu-scraper/scraper.log